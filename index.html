<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Rescue — PixelProTech Solutions</title>
<meta name="theme-color" content="#07070A">
<meta name="description" content="First aid for dead devices: what to stop, what is safe to try, when to hand over.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070A;--pp:#7B2FFF;--tl:#00D4AA;--gd:#D8B96A;--rd:#FF4040;--am:#FFB020;--tx:#F1EEFA;--t2:#9A90B8;--t3:#524B6A;--br:rgba(255,255,255,.1);--sev:var(--tl);
--d:'Orbitron',system-ui,sans-serif;--b:'Space Grotesk',system-ui,sans-serif;--m:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--tx);font:15px/1.5 var(--b);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
background-image:radial-gradient(circle at 1px 1px,rgba(123,47,255,.22) 1px,transparent 1.5px);background-size:22px 22px}
.sh{max-width:880px;margin:0 auto;padding:18px 18px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
header img{width:44px;height:44px;border-radius:10px}
h1{font:900 17px var(--d);letter-spacing:.16em}
.sub{font:10px var(--m);letter-spacing:.22em;color:var(--t3)}
.ecg{width:100%;height:46px;display:block;margin:8px 0 18px}
.ecg path{fill:none;stroke:var(--sev);stroke-width:2;stroke-dasharray:420;stroke-dashoffset:420;animation:beat 2.4s linear infinite;filter:drop-shadow(0 0 4px var(--sev))}
body.r .ecg path{animation-duration:1s}
@keyframes beat{to{stroke-dashoffset:0}}
a{color:inherit;text-decoration:none}
.first{border:1px solid var(--br);border-left:4px solid var(--gd);background:rgba(255,255,255,.03);border-radius:10px;padding:14px 16px;margin-bottom:22px}
.first b{font:700 11px var(--m);letter-spacing:.2em;color:var(--gd)}
.first ol{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 18px;margin:10px 0 0 18px;font-size:14px}
h2{font:700 11px var(--m);letter-spacing:.28em;color:var(--t2);margin:6px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tag{position:relative;display:block;padding:16px 16px 16px 20px;border-radius:4px 14px 14px 4px;background:#0d0d14;border:1px solid var(--br);
border-left:8px solid var(--sev);transition:transform .15s,box-shadow .15s}
.tag::before{content:'';position:absolute;right:14px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:1px solid var(--br)}
.tag:hover,.tag:focus-visible{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 14px 30px -14px var(--sev);outline:none}
.tn{font:10px var(--m);letter-spacing:.2em;color:var(--t3)}
.tag h3{font:700 17px var(--b);margin:4px 0 4px}
.tag p{font-size:13px;color:var(--t2)}
.st{display:inline-block;margin-top:10px;font:700 9px var(--m);letter-spacing:.2em;padding:3px 8px;border:1.5px solid var(--sev);color:var(--sev);transform:rotate(-3deg);border-radius:3px}
.r{--sev:var(--rd)}.a{--sev:var(--am)}.g{--sev:var(--tl)}
.back{display:inline-block;font:11px var(--m);letter-spacing:.18em;color:var(--t2);margin-bottom:12px}
.hd{border-left:8px solid var(--sev);padding-left:14px;margin-bottom:18px}
.hd h2{font:900 clamp(20px,5vw,28px) var(--d);letter-spacing:.04em;color:var(--tx);margin:2px 0}
.cols{display:grid;gap:14px}
@media(min-width:760px){.cols{grid-template-columns:1fr 1fr 1fr}}
.col{border:1px solid var(--br);border-radius:10px;padding:14px;background:rgba(255,255,255,.025)}
.col h4{font:700 11px var(--m);letter-spacing:.22em;margin-bottom:10px}
.col.s h4{color:var(--rd)}.col.f h4{color:var(--tl)}.col.h h4{color:var(--gd)}
.col li{list-style:none;padding:8px 0 8px 26px;position:relative;font-size:14px;border-top:1px dashed var(--br);cursor:pointer}
.col li:first-of-type{border-top:0}
.col li::before{content:'';position:absolute;left:2px;top:12px;width:13px;height:13px;border:1.5px solid var(--t3)}
.col.s li::before{border-color:var(--rd)}
.col li.on{color:var(--t3);text-decoration:line-through}
.col li.on::before{background:var(--tl);border-color:var(--tl)}
.btn{display:inline-block;margin-top:18px;padding:12px 20px;font:700 12px var(--m);letter-spacing:.16em;border:1.5px solid var(--gd);color:var(--gd);background:transparent;border-radius:8px;cursor:pointer}
.btn:hover{background:rgba(216,185,106,.12)}
.btn.p{border-color:var(--tl);color:var(--tl)}
form{display:grid;gap:12px;margin-bottom:6px}
label{font:10px var(--m);letter-spacing:.18em;color:var(--t2);display:grid;gap:5px}
input,select,textarea{font:15px var(--b);color:var(--tx);background:#0d0d14;border:1px solid var(--br);border-radius:8px;padding:10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pp)}
.two{display:grid;gap:12px}@media(min-width:600px){.two{grid-template-columns:1fr 1fr}}
.warn{font-size:12px;color:var(--am);border:1px solid rgba(255,176,32,.4);border-radius:8px;padding:8px 10px}
#card{margin-top:22px;background:#F1EEFA;color:#111;border-radius:6px;padding:20px;border-top:10px solid var(--sev);font-size:14px}
#card h3{font:900 15px var(--d);letter-spacing:.1em;margin-bottom:2px}
#card .k{font:10px var(--m);letter-spacing:.14em;color:#555;margin-top:10px}
#card .v{white-space:pre-wrap;border-bottom:1px solid #bbb;padding-bottom:3px;min-height:20px}
.row{display:flex;gap:10px;flex-wrap:wrap}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--br);font:10px/1.7 var(--m);letter-spacing:.1em;color:var(--t3)}
@media print{body{background:#fff}body *{visibility:hidden}#card,#card *{visibility:visible}#card{position:absolute;left:0;top:0;width:100%;margin:0}}
</style>
</head>
<body>
<div class="sh">
<header><img src="icon.svg" alt="Pixel Rescue logo, a pixel lifebuoy"><div><h1>PIXEL RESCUE</h1><div class="sub">FIRST AID FOR DEAD DEVICES</div></div></header>
<svg class="ecg" viewBox="0 0 400 46" preserveAspectRatio="none" aria-hidden="true"><path d="M0 24H70L82 24 90 8 100 40 110 14 118 24H190L202 24 210 8 220 40 230 14 238 24H310L322 24 330 8 340 40 350 14 358 24H400"/></svg>
<main id="app"></main>
<footer>PIXELPROTECH SOLUTIONS (PTY) LTD · REG 2026/622131/07 · PIXELPROTECHSOLUTIONS@PROTON.ME<br>GENERAL FIRST-AID GUIDANCE ONLY. IF THE DATA CANNOT BE REPLACED, STOP AND HAND THE DEVICE TO A TECHNICIAN. RUNS OFFLINE, STORES NOTHING ON A SERVER.</footer>
</div>
<script>
const SEV={r:'RED · ACT NOW',a:'AMBER · CAREFUL',g:'GREEN · LOW RISK'};
const C=[
{id:'nopower',n:'Will not turn on',s:'Dead laptop or PC, no lights, no sound.',v:'g',
 stop:['Stop pressing the power button over and over','Do not try random chargers: wrong voltage can kill the board','Do not open it up if it is still under warranty'],
 safe:['Try a different wall socket and a known-good charger','Check the charger light and the plug at the laptop end','Unplug everything, hold power 30 seconds, plug in and try once','Remove the battery first if it is removable'],
 hand:['Charger is good and there is still nothing','The battery looks swollen or the case is bulging','Burning smell, heat, or a pop when you plugged in']},
{id:'noboot',n:'Turns on, will not start',s:'Black screen, boot loop, or error message.',v:'a',
 stop:['Do not choose Reset this PC or reinstall Windows: it can erase your files','Do not force power off again and again','Do not guess fixes from random videos'],
 safe:['Photograph the exact error message','Unplug USB sticks, printers and docks, then restart once','Try Safe Mode from the recovery screen','If files matter, copy them out with a rescue USB before any repair'],
 hand:['The message says no boot device or disk error','The BIOS does not list the drive','You need the files and are not sure of the next step']},
{id:'clicking',n:'Drive clicking or missing',s:'Grinding, ticking, beeping, or not detected.',v:'r',
 stop:['Power it OFF now: every spin-up can scrape the platters','Do not run CHKDSK, disk repair or "fix" tools on it','Do not shake it, freeze it, or open the casing','Do not install recovery software onto the failing drive'],
 safe:['Disconnect it and put it somewhere dry and still','Label it with the date and what happened','Write down what was on it and how much it matters'],
 hand:['Always. A clicking drive needs a lab, not a download','Hand it over before trying anything else']},
{id:'liquid',n:'Liquid spill',s:'Water, tea, coffee, or anything wet got in.',v:'r',
 stop:['Do not turn it on and do not plug in a charger','Do not use a hairdryer or heater','Do not shake it around to drain it'],
 safe:['Power off and unplug right now; remove the battery if you can','Tilt it open-side down on a towel to drain','Wipe the outside only, then leave it in open air'],
 hand:['Always, within a day or two: corrosion keeps working','Sugary drinks, salt water, or dirty water: go today']},
{id:'ransom',n:'Ransomware or locked files',s:'A note demands payment, files will not open.',v:'r',
 stop:['Do not pay: there is no promise you get anything back','Do not delete the ransom note or the encrypted files','Do not keep working on the infected machine'],
 safe:['Unplug the network cable and turn off Wi-Fi now','Photograph the note and the file names','Check your offline or cloud backups, using a different clean device','Change your passwords from a clean device, not the infected one'],
 hand:['Always, especially for a business or shared network','Check nomoreransom.org for a free decryptor first']},
{id:'deleted',n:'Deleted or formatted',s:'Files gone by accident, or a drive got wiped.',v:'a',
 stop:['Stop saving anything onto that drive','Do not install recovery software onto the same drive','Do not defragment or clean up the disk'],
 safe:['Check the Recycle Bin and any cloud version history','Try Previous Versions or File History if switched on','Install recovery software on a DIFFERENT drive and recover to a different drive'],
 hand:['The files matter and the steps above found nothing','It is an SSD: recovery chances fall fast once it keeps running']},
{id:'phone',n:'Phone dead or not charging',s:'No charge, no screen, stuck on the logo.',v:'g',
 stop:['Do not use a bent or frayed cable','Do not poke the port with metal','Do not keep charging if it gets hot or swells'],
 safe:['Try another cable, charger and wall socket','Gently clear lint from the port with a wooden toothpick','Charge for 30 minutes, then force restart for your model','Back up photos the moment it wakes up'],
 hand:['The back or screen is lifting: swollen battery','It stays dead on a good charger','It got wet at any point']}];
const $=s=>document.querySelector(s),app=$('#app');
const first='<div class="first"><b>FIRST 60 SECONDS</b><ol><li><b>STOP</b> touching it</li><li><b>DO NOT</b> keep power cycling</li><li><b>PHOTO</b> any error screen</li><li><b>WRITE</b> what happened, and when</li></ol></div>';
function home(){document.body.className='';
 app.innerHTML=first+'<h2>PICK THE SYMPTOM · TRIAGE TAGS</h2><div class="grid">'+C.map((c,i)=>`<a class="tag ${c.v}" href="#/case/${c.id}"><div class="tn">TAG ${String(i+1).padStart(2,'0')}</div><h3>${c.n}</h3><p>${c.s}</p><span class="st">${SEV[c.v]}</span></a>`).join('')+'</div><a class="btn" href="#/handover">OPEN HANDOVER SHEET</a>';}
function cs(id){const c=C.find(x=>x.id===id);if(!c)return home();document.body.className=c.v;
 const L=(t,a,k)=>`<div class="col ${k}"><h4>${t}</h4><ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
 app.innerHTML=`<a class="back" href="#/">‹ ALL SYMPTOMS</a><div class="hd ${c.v}"><div class="tn">${SEV[c.v]}</div><h2>${c.n}</h2><p style="color:var(--t2)">${c.s}</p></div><div class="cols">${L('STOP DOING',c.stop,'s')+L('SAFE TO TRY',c.safe,'f')+L('HAND OVER IF',c.hand,'h')}</div><p style="font-size:12px;color:var(--t3);margin-top:10px">Tap a step to tick it off.</p><a class="btn" href="#/handover/${c.id}">PREPARE HANDOVER SHEET ›</a>`;
 app.querySelectorAll('li').forEach(l=>l.onclick=()=>l.classList.toggle('on'));}
const K='pixelrescue.intake.v1',F=['who','tel','dev','sym','when','tried','imp','acc'];
function ho(id){const c=C.find(x=>x.id===id);document.body.className=c?c.v:'';
 let d={};try{d=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}
 if(c)d.sym=c.n;
 app.innerHTML=`<a class="back" href="#/">‹ BACK</a><h2>HANDOVER SHEET · FOR THE TECHNICIAN</h2>
<form onsubmit="return false"><div class="two"><label>OWNER NAME<input id="who"></label><label>PHONE OR EMAIL<input id="tel"></label></div>
<div class="two"><label>DEVICE (BRAND, MODEL)<input id="dev"></label><label>SYMPTOM<select id="sym"><option value="">Choose…</option>${C.map(x=>`<option>${x.n}</option>`).join('')}<option>Other</option></select></label></div>
<label>WHAT HAPPENED, AND WHEN<textarea id="when" rows="3"></textarea></label><label>WHAT WAS ALREADY TRIED<textarea id="tried" rows="2"></textarea></label>
<div class="two"><label>HOW IMPORTANT IS THE DATA<select id="imp"><option>Irreplaceable: stop and hand over</option><option>Important, would hurt to lose</option><option>Replaceable</option></select></label><label>LEFT WITH DEVICE (CHARGER, BAG…)<input id="acc"></label></div>
<div class="warn">Never write passwords or PINs here. Tell the technician in person.</div></form>
<div id="card"><h3>PIXEL RESCUE · DEVICE HANDOVER</h3><div class="tn" style="color:#555">PIXELPROTECH SOLUTIONS</div><div id="cb"></div></div>
<div class="row"><button class="btn p" id="pr">PRINT / SAVE PDF</button><button class="btn" id="cp">COPY AS TEXT</button><button class="btn" id="sh">SHARE</button></div>`;
 const lab={who:'OWNER',tel:'CONTACT',dev:'DEVICE',sym:'SYMPTOM',when:'WHAT HAPPENED',tried:'ALREADY TRIED',imp:'DATA IMPORTANCE',acc:'LEFT WITH DEVICE'};
 const get=()=>Object.fromEntries(F.map(k=>[k,$('#'+k).value.trim()]));
 const draw=()=>{const v=get();$('#cb').innerHTML=F.map(k=>`<div class="k">${lab[k]}</div><div class="v"></div>`).join('')+`<div class="k">DATE</div><div class="v"></div>`;
  const vs=$('#cb').querySelectorAll('.v');F.forEach((k,i)=>vs[i].textContent=v[k]);vs[F.length].textContent=new Date().toLocaleDateString('en-ZA');
  try{localStorage.setItem(K,JSON.stringify(v))}catch(e){}};
 F.forEach(k=>{$('#'+k).value=d[k]||'';$('#'+k).addEventListener('input',draw)});
 if(!$('#imp').value)$('#imp').selectedIndex=0;draw();
 const txt=()=>{const v=get();return 'PIXEL RESCUE · DEVICE HANDOVER\n'+F.map(k=>lab[k]+': '+v[k]).join('\n')+'\nDATE: '+new Date().toLocaleDateString('en-ZA')};
 $('#pr').onclick=()=>print();
 $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(txt());$('#cp').textContent='COPIED'}catch(e){$('#cp').textContent='COPY NOT ALLOWED'}};
 if(navigator.share)$('#sh').onclick=()=>navigator.share({title:'Device handover',text:txt()}).catch(()=>{});else $('#sh').remove();}
function route(){const p=location.hash.replace(/^#\/?/,'').split('/');scrollTo(0,0);
 if(p[0]==='case')cs(p[1]);else if(p[0]==='handover')ho(p[1]);else home();}
addEventListener('hashchange',route);route();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
